<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body{
            font-family:'Georgia', Times New Roman;
        }
        table{
            width: 63%; /* how much of the page the table will take up */
            border: 1px solid #000000;
            margin:auto; /* center the table */
            border-collapse: collapse; /* merge borders*/
        }
        th{
            color:#7f0909;
            border: 1px solid #000000;
            padding: 12px 6px;
            text-align: left;
            background-color: #e6e6e6;
        }
        td{
            color:#300202;
            border: 1px solid #000000;
            padding: 12px 6px;
            text-align: left;
        }
        .salary{
            color:#0c0c7f;
            font-weight: bold;
        }

        /* CSS framework-- bootstrap */
        
    </style>
</head>

<body>
    <table>
    
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
             </tr>
        </thead>
        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td> 
                <td class="salary">60000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Smith</td>
                <td>Kisumu</td>
                <td>30</td>
                <td class="salary">50000</td>
            </tr>
            <tr>
                <td>Mary</td>
                <td>Wanjiru</td>
                <td>Mombasa</td>
                <td>25</td>
                <td class="salary">70000</td>
            </tr>
            <tr>
                <td>Peter</td>
                <td>Otieno</td>
                <td>Nakuru</td>
                <td>28</td>
                <td class="salary">80000</td>
            </tr>
            <tr>
                <td>Lucy</td>
                <td>Kamau</td>
                <td>Eldoret</td>
                <td>22</td>
                <td class="salary">55000</td>
            </tr>
            <tr>
                <td>David</td>
                <td>Ochieng</td>
                <td>Thika</td>
                <td>35</td>
                <td class="salary">90000</td>
            </tr>
            <tr>
                <td>Grace</td>
                <td>Wambui</td>
                <td>Kitale</td>
                <td>27</td>
                <td class="salary">75000</td>
            </tr>

        </tbody>


    </table>

    <!-- list Unordered -->
    <ul>
        <li>Nairobi</li>
        <li>Kisumu</li>
        <li>Mombasa</li>
        <li>Nakuru</li>
        <li>Eldoret</li>
    </ul>

</body>
</html>
